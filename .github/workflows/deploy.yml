name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish the game folder AS the site root so the URL stays clean:
      #   index.html = the self-contained game bundle (which loads css/ + js/ beside it)
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r "English-summative-AI_integrated/." _site/
          cp "English-summative-AI_integrated/Art Authentication Bureau.html" "_site/index.html"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
